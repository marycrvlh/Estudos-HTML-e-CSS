<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> Login </title>
</head>
<body>
    <section class="login-container">
        <h2 class="titulo"> Bem-Vindo! </h2>
        
        <div class="login">
            <form>
                <label> Login </label>
                <input type="text" placeholder="Digite o seu login" id="login">

                <label> Senha </label>
                <input type="password" placeholder="Digite a sua senha" id="senha">

                <button type="submit" class="botao"> Entrar </button>
            </form>
        </div>

        <div class="criar-conta">
            <p> Não tem conta? <a href="#cadastro"> Clique aqui </a> </p>
        </div>
    </section>

    <section class="cadastro-container">
        <h2 class="titulo"> Bem-Vindo! </h2>
        <p> Crie sua conta </p>

        <div class="cadastro">
            <form>
                <label> E-mail </label>
                <input type="email" placeholder="exemplo@email.com" id="email">
                <label> Telefone </label>
                <input type="tel" placeholder="+55 DDD + número">
                <label> Nome </label>
                <input type="text" placeholder="Seu nome completo">
                <label> Senha </label>
                <input type="password" placeholder="Digite a sua senha">

                <input type="checkbox"> Aceito os termos de uso


                <button class="botao"> Cadastrar </button>
            </form>

            


        </div>


    </section>

</body>
</html>
